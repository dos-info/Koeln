<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOS Academy · Deutsch Klasse 7 · Lektion 3 &amp; 4</title>
<style>
:root{--bg:#fff;--card:#f6f3ec;--tx:#111;--mu:#666;--red:#d71920;--yel:#ffc400;--bd:#ddd;--ok:#1b8a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--card:#1b1b1b;--tx:#f3f3f3;--mu:#aaa;--bd:#333;--ok:#3ecf6a}}
:root[data-theme="dark"]{--bg:#0e0e0e;--card:#1b1b1b;--tx:#f3f3f3;--mu:#aaa;--bd:#333;--ok:#3ecf6a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{background:#000;color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-bottom:4px solid var(--red)}
header img{height:46px;width:auto}
header h1{font-size:17px;margin:0;flex:1;min-width:180px}header small{color:var(--yel);display:block;font-weight:400}
select,input[type=search]{padding:6px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:11;border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600}
nav button.on{background:var(--red);color:#fff;border-color:var(--red)}
main{max-width:940px;margin:0 auto;padding:14px}
section{display:none}section.on{display:block}
h2{border-inline-start:6px solid var(--yel);padding-inline-start:10px}
.card,.q{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}.grid .card{margin:0}
.tr{color:var(--mu);font-size:14px}.ex{font-style:italic;margin-top:4px}
button.b{background:var(--red);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;margin:4px 4px 0 0}
button.w{background:var(--yel);color:#000}
.ico{background:none;border:0;cursor:pointer;font-size:18px;color:var(--tx)}
.q.ok{border-color:var(--ok)}.q.no{border-color:var(--red)}
.fb{margin-top:6px;font-weight:600}.q.ok .fb{color:var(--ok)}.q.no .fb{color:var(--red)}
.tag{display:inline-block;font-size:12px;background:var(--yel);color:#000;border-radius:10px;padding:1px 9px;margin-inline-end:6px;font-weight:700}
.big{font-size:44px;margin:4px 0}
input[type=text],textarea{width:100%;padding:8px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.chip{display:inline-block;margin:3px;padding:5px 10px;border-radius:14px;background:var(--yel);color:#000;cursor:pointer}
.ans{min-height:40px;border:2px dashed var(--bd);border-radius:8px;padding:3px;margin:6px 0}
label{display:block;margin:3px 0;cursor:pointer}
.note{font-size:44px;font-weight:900;color:var(--red)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.sb{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.sb button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}.sb button.on{background:var(--yel);color:#000;border-color:var(--yel)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#000;color:#fff;border-radius:12px;padding:16px;border-bottom:5px solid var(--red)}.hero img{height:90px}.hero small{color:var(--yel)}
.toc button{margin-top:6px}.soon{opacity:.55}
a.gt{text-decoration:none;font-size:16px}
a.vd{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;margin:4px 4px 0 0;font-weight:600}
</style></head><body>

const GR=P(`Die Berufekarte: Informationen zu einem Beruf sammeln|Eine <b>Berufekarte</b> (Karteikarte) hilft dir, Berufe kennenzulernen und zu vergleichen. <b>Stichworte:</b> Berufsbezeichnung · Tätigkeiten und geforderte Fähigkeiten · Arbeitsorte und Arbeitszeiten · Arbeitsmittel/Arbeitsgeräte · Kontakt zu Menschen · geforderter Schulabschluss · Art der Ausbildung (z. B. dual) und Dauer · Ausbildungsvergütung. <b>Quellen:</b> Menschen befragen, sie bei der Arbeit beobachten, Bücher, Zeitungen und Zeitschriften lesen, im Internet suchen (z. B. Berufenet der Bundesagentur für Arbeit). <b>Satzanfänge zum Vorstellen:</b> Ein Optiker beschäftigt sich mit … · Der Beruf der Bestatterin umfasst … · Ein Sekretär kümmert sich um … · Die Aufgaben einer Modedesignerin sind … <b>Achtung:</b> Schreibe nur Stichworte, keine langen Sätze, und nutze mehrere Quellen. Häufiger Fehler: wichtige Stichworte wie die Ausbildungsvergütung vergessen.|<b>بطاقة المهنة</b> (Berufekarte) تساعدك على التعرّف على المهن ومقارنتها. <b>الكلمات المفتاحية:</b> اسم المهنة · المهام والقدرات المطلوبة · أماكن العمل وأوقاته · أدوات العمل · الاتصال بالناس · الشهادة الدراسية المطلوبة · نوع التدريب (مثل المزدوج) ومدّته · أجر التدريب. <b>المصادر:</b> سؤال العاملين في المهنة، ومراقبتهم أثناء العمل، وقراءة الكتب والصحف والمجلات، والبحث في الإنترنت (مثل موقع Berufenet التابع للوكالة الاتحادية للعمل). <b>بدايات جمل للتقديم:</b> الـ Optiker يهتم بـ… · مهنة الـ Bestatterin تشمل… · الـ Sekretär يعتني بـ… · مهام مصمّمة الأزياء هي… <b>تنبيه:</b> اكتب كلمات مفتاحية فقط لا جملًا طويلة، واعتمد على أكثر من مصدر. خطأ شائع: نسيان نقطة مهمة مثل أجر التدريب.
Eigenschaften, Fähigkeiten und Tätigkeiten|Berufe verlangen bestimmte <b>Eigenschaften und Fähigkeiten</b>: reaktionsschnell (Bademeister/in), handwerklich geschickt (Tischler/in), höflich und kontaktfreudig (Sekretär/in), kreativ (Modedesigner/in), exakt und sorgfältig (Optiker/in), mitfühlend (Bestatter/in), außerdem kräftig, mutig, flexibel, strukturiert. <b>Tätigkeiten</b> beschreibst du mit Verb + Ergänzung: am Computer arbeiten, Holz bearbeiten, im Team arbeiten, Kunden beraten, Produkte entwickeln, andere überzeugen, Pflanzen pflegen, Bücher empfehlen. <b>Adjektive:</b> Nach sein/werden bleiben sie ohne Endung (Er ist kreativ); vor einem Nomen bekommen sie eine Endung (ein kreativer Designer, eine sorgfältige Arbeit). <b>Achtung:</b> Verwechsle nicht <b>Eigenschaft</b> (wie ich bin: höflich) und <b>Tätigkeit</b> (was ich tue: Kunden beraten).|تتطلّب المهن <b>صفات وقدرات</b> معيّنة: سريع الاستجابة (مشرف السباحة)، ماهر يدويًّا (النجّار)، مهذّب واجتماعي (السكرتير)، مبدع (مصمم الأزياء)، دقيق ومتأنٍّ (أخصائي البصريات)، متعاطف (متعهّد الدفن)، وكذلك قوي البنية وشجاع ومرن ومنظّم. <b>المهام</b> تُوصف بفعل + تكملة: العمل على الحاسوب، معالجة الخشب، العمل ضمن فريق، نصح الزبائن، تطوير المنتجات، إقناع الآخرين، العناية بالنباتات، التوصية بالكتب. <b>الصفات:</b> بعد sein/werden تبقى بلا نهاية (Er ist kreativ)، وقبل الاسم تأخذ نهاية (ein kreativer Designer). <b>تنبيه:</b> لا تخلط بين <b>الصفة</b> (كيف أنا: مهذّب) و<b>المهمة</b> (ماذا أفعل: أنصح الزبائن).
Interessen erkennen und die Kugellager-Methode|Wer einen Beruf wählt, sollte wissen, was er <b>gern macht</b> und <b>gut kann</b> – und was nicht. Hobbys führen zu Tätigkeiten und Fähigkeiten: Computerspiele → am Computer arbeiten, technisch interessiert; Pflanzen → Pflanzen pflegen. <b>Selbsteinschätzung:</b> Stärken in der Schule (Deutsch, Englisch, Mathematik, Naturwissenschaften, Gesellschaftswissenschaften, Informatik, Sport, Musik/Kunst), Arbeitsverhalten (pünktlich, selbstständig, ordentlich) und Umgang mit anderen (Teamarbeit, höflich, hilft anderen). Eine Partnerin oder ein Partner schätzt dich ebenfalls ein (<b>Fremdeinschätzung</b>); danach vergleicht ihr. <b>Kugellager-Methode:</b> 1. Bildet einen Innen- und einen Außenkreis; die Personen sitzen sich gegenüber. 2. Die Gegenübersitzenden sprechen über ihre Hobbys und Interessen. 3. Nach einer Minute rutscht der Innenkreis einen Platz weiter. <b>Achtung:</b> Selbst- und Fremdbild stimmen nicht immer überein – das ist normal; sprecht darüber und lernt daraus.|من يختار مهنة عليه أن يعرف <b>ما يحبّ فعله</b> و<b>ما يجيده</b>، وما لا يناسبه. الهوايات تقود إلى مهام وقدرات: ألعاب الحاسوب ← العمل على الحاسوب والاهتمام بالتقنية؛ النباتات ← العناية بالنباتات. <b>التقييم الذاتي:</b> نقاط القوة في المدرسة (ألمانية، إنجليزية، رياضيات، علوم، اجتماعيات، معلوماتية، رياضة، موسيقى/فن)، وسلوك العمل (دقة المواعيد، الاستقلالية، الترتيب)، والتعامل مع الآخرين (العمل الجماعي، التهذيب، مساعدة الغير). ثم يقيّمك شريك (<b>التقييم الخارجي</b>) وتقارنان النتائج. <b>طريقة الكرة المحمّلة (Kugellager):</b> 1. شكّلوا دائرة داخلية وأخرى خارجية والأشخاص متقابلون. 2. المتقابلون يتحدثون عن هواياتهم واهتماماتهم. 3. بعد دقيقة تتحرّك الدائرة الداخلية مقعدًا واحدًا. <b>تنبيه:</b> صورتك عن نفسك وصورة الآخرين عنك قد تختلفان، وهذا طبيعي؛ تحدّثا عنه وتعلّما منه.
Das Interview: Fragen formulieren|Im Interview stellt man <b>W-Fragen</b> (Was? Wo? Wie lange? Welche?) und <b>Entscheidungsfragen</b> (Arbeiten Sie allein?). Typische Fragen an die Mediengestalterin: Seit wann arbeiten Sie in diesem Beruf? · Wie heißt die genaue Berufsbezeichnung? · Was gestalten Sie? · Arbeiten Sie allein oder im Team? · Wo kann man arbeiten? · Wie sieht Ihr Arbeitsalltag aus? · Welche Fähigkeiten braucht man? · Braucht man technische Kenntnisse? · Welcher Schulabschluss ist nötig und wie lange dauert die Ausbildung? Zum Schluss: Vielen Dank für das Gespräch! <b>Regeln:</b> höfliche Anrede mit <b>Sie</b> (großgeschrieben); bei W-Fragen steht das Verb an Position 2 (Wie lange dauert die Ausbildung?), bei Entscheidungsfragen an Position 1 (Arbeiten Sie allein?). <b>Achtung:</b> Zu fremden Erwachsenen sagt man nicht «du»; bei Entscheidungsfragen kann man nur mit «ja» oder «nein» antworten.|في المقابلة تُطرح <b>أسئلة الاستفهام</b> (Was? Wo? Wie lange? Welche?) و<b>أسئلة نعم/لا</b> (Arbeiten Sie allein؟). أسئلة نموذجية لمصمّمة الوسائط: منذ متى تعملين في هذه المهنة؟ · ما الاسم الدقيق للمهنة؟ · ماذا تصمّمين؟ · هل تعملين وحدك أم ضمن فريق؟ · أين يمكن العمل؟ · كيف يبدو يوم عملك؟ · ما القدرات المطلوبة؟ · هل تلزم معرفة تقنية؟ · ما الشهادة اللازمة وكم تدوم الدراسة؟ وفي الختام: شكرًا على الحوار! <b>القواعد:</b> مخاطبة مهذّبة بـ <b>Sie</b> (بحرف كبير)؛ في أسئلة الاستفهام يقع الفعل في الموضع الثاني (Wie lange dauert die Ausbildung?)، وفي أسئلة نعم/لا في الموضع الأول (Arbeiten Sie allein?). <b>تنبيه:</b> لا نقول «du» للكبار الغرباء؛ وأسئلة نعم/لا جوابها «ja» أو «nein» فقط.
Berufe und Geschlecht: Statistik, Girls' Day und Boys' Day|Manche Berufe haben einen hohen <b>Frauenanteil</b> (z. B. Kosmetiker/in, Erzieher/in, Hauswirtschafter/in), andere einen hohen <b>Männeranteil</b> (z. B. Maurer/in, Metall- und Elektroberufe). Der <b>Girls' Day</b> (seit 2001) zeigt Mädchen technische und handwerkliche Berufe; der <b>Boys' Day</b> (seit 2011) zeigt Jungen Berufe in Erziehung, Gesundheitswesen und Dienstleistung. Rund 80 % der Mädchen entscheiden sich für einen typischen Frauenberuf im Dienstleistungs-, Sozial- oder Gesundheitsbereich; das sind von etwa 330 Ausbildungsberufen nur etwa 25. In Statistiken liest man <b>Prozent (%)</b> = von hundert. Nützliche Wörter: der Anteil, die Quelle, die Angabe, überwiegend, selten, häufig. <b>Achtung:</b> Eine Statistik zeigt, was häufig ist, nicht was erlaubt ist – jeder darf jeden Beruf lernen.|بعض المهن فيها <b>نسبة نساء</b> عالية (مثل التجميل والتربية والاقتصاد المنزلي)، وأخرى فيها <b>نسبة رجال</b> عالية (مثل البناء والمهن المعدنية والكهربائية). <b>Girls' Day</b> (منذ 2001) يُري الفتيات المهن التقنية والحِرفية، و<b>Boys' Day</b> (منذ 2011) يُري الفتيان مهن التربية والصحة والخدمات. نحو 80% من الفتيات يختَرن مهنًا نسائية نمطية في الخدمات والاجتماع والصحة، وهي من بين نحو 330 مهنة تدريبية قرابة 25 مهنة فقط. في الإحصائيات نقرأ <b>النسبة المئوية (%)</b> = من مئة. كلمات مفيدة: der Anteil (النسبة)، die Quelle (المصدر)، die Angabe (البيان)، überwiegend (غالبًا)، selten (نادرًا)، häufig (كثيرًا). <b>تنبيه:</b> الإحصائية تبيّن ما هو شائع لا ما هو مسموح؛ فلكل شخص أن يتعلّم أي مهنة.
Rechtschreibstrategie 1: Deutlich sprechen und verlängern|Im Deutschen hört man am Wort- oder Silbenende <b>b wie p, d wie t, g wie k</b>. Darum <b>verlängerst</b> du das Wort, bis du den Buchstaben deutlich hörst. <b>Nomen:</b> Mehrzahl bilden (der Urlaub – die Urlaube, der Wald – die Wälder, der Dieb – die Diebe, der Berg – die Berge, der Freund – die Freunde, das Hemd – die Hemden, das Gehalt – die Gehälter). <b>Verben:</b> Grundform bilden (er jagt – jagen, sie gibt – geben, er bleibt – bleiben, sie singt – singen). <b>Adjektive:</b> Form mit Endung bilden (fertig – fertige, wild – wilde). Wörter ohne Mehrzahl verlängerst du anders (die Arbeit – arbeiten, die Zeit – zeitlich). <b>Achtung:</b> Das Sprechen nach der Schrift gilt nicht für alle Sprachen (Englisch, Französisch, Polnisch schreiben anders als sie sprechen); bei Fremdwörtern hilft die Strategie nicht immer – dann im Wörterbuch nachschlagen.|في الألمانية نسمع في نهاية الكلمة أو المقطع <b>b كأنها p، وd كأنها t، وg كأنها k</b>. لذلك <b>نطيل</b> الكلمة حتى نسمع الحرف بوضوح. <b>الأسماء:</b> نكوّن الجمع (der Urlaub – die Urlaube، der Wald – die Wälder، der Dieb – die Diebe، der Berg – die Berge، der Freund – die Freunde، das Hemd – die Hemden). <b>الأفعال:</b> نكوّن المصدر (er jagt – jagen، sie gibt – geben، er bleibt – bleiben، sie singt – singen). <b>الصفات:</b> نضيف نهاية (fertig – fertige، wild – wilde). والكلمات بلا جمع نطيلها بطريقة أخرى (die Arbeit – arbeiten). <b>تنبيه:</b> الكتابة كما تُنطق لا تصحّ في كل اللغات (الإنجليزية والفرنسية والبولندية تُكتب بغير ما تُنطق)؛ وفي الكلمات الأجنبية لا تنفع القاعدة دائمًا فنراجع القاموس.
Rechtschreibstrategie 2: Doppelkonsonanten nach kurzem Vokal|Nach einem <b>kurzen, betonten Vokal</b> verdoppelt sich der folgende Konsonant: Ball, Ballett, kommen, Kommando, Kontrolle, brennen, Brennnessel, Bitte. Nach einem <b>langen Vokal</b> oder einem <b>Doppellaut</b> (ei, au, eu) steht nur <b>ein</b> Konsonant: proben, Blume, Leben, Haus, leuchten. Sprich das Wort <b>langsam in Silben</b> (Kon-trol-le) und höre, ob der Vokal kurz klingt. Statt kk schreibt man <b>ck</b> (backen), statt zz <b>tz</b> (Katze). Nach langem Vokal oder Doppellaut schreibt man <b>ß</b> (reißen, Fuß). <b>Achtung:</b> Folgen nach dem kurzen Vokal zwei verschiedene Konsonanten, verdoppelt man nichts (Kerze, Kampf, Wurst).|بعد <b>حرف علّة قصير مشدَّد النبر</b> يتضاعف الحرف الساكن التالي: Ball, Ballett, kommen, Kommando, Kontrolle, brennen, Brennnessel, Bitte. وبعد <b>حرف علّة طويل</b> أو <b>حرف علّة مركّب</b> (ei, au, eu) يأتي حرف ساكن <b>واحد</b>: proben, Blume, Leben, Haus, leuchten. انطق الكلمة <b>ببطء على مقاطع</b> (Kon-trol-le) واسمع هل الحرف قصير. بدل kk نكتب <b>ck</b> (backen) وبدل zz نكتب <b>tz</b> (Katze). وبعد الحرف الطويل أو المركّب نكتب <b>ß</b> (reißen, Fuß). <b>تنبيه:</b> إذا جاء بعد الحرف القصير ساكنان مختلفان فلا مضاعفة (Kerze, Kampf, Wurst).
Rechtschreibstrategie 3: Ableiten (ä/e, äu/eu)|Bei <b>ä oder e</b> und <b>äu oder eu</b> suchst du ein <b>verwandtes Wort</b> (Wortfamilie). Gibt es eines mit <b>a</b> bzw. <b>au</b>, schreibst du <b>ä</b> bzw. <b>äu</b>: kräftig ← Kraft · Bälle ← Ball · Wälder ← Wald · Städte ← Stadt · gefährlich ← Gefahr · Verkäuferin ← verkaufen · Gebäude ← bauen · Räume ← Raum · Häuser ← Haus · Läufe ← Lauf · Bäcker ← backen · ängstlich ← Angst · ländlich ← Land. Gibt es kein verwandtes Wort mit a/au, schreibt man meist <b>e/eu</b>: Feuerwehr (Feuer), Freunde (Freund), Gedanken (denken). Auch den Umlaut <b>ü</b> kannst du ableiten: Kürzung ← kurz. <b>Achtung:</b> Einige Wörter muss man sich merken, z. B. Eltern, Leute, heute.|عند الشك بين <b>ä أو e</b> و<b>äu أو eu</b> ابحث عن <b>كلمة من العائلة نفسها</b>. إن وُجدت كلمة فيها <b>a</b> أو <b>au</b> فاكتب <b>ä</b> أو <b>äu</b>: kräftig ← Kraft · Bälle ← Ball · Wälder ← Wald · Städte ← Stadt · gefährlich ← Gefahr · Verkäuferin ← verkaufen · Gebäude ← bauen · Räume ← Raum · Häuser ← Haus · Läufe ← Lauf · Bäcker ← backen · ängstlich ← Angst · ländlich ← Land. وإن لم توجد كلمة قريبة فيها a/au فالغالب <b>e/eu</b>: Feuerwehr (Feuer)، Freunde (Freund)، Gedanken (denken). وكذلك يُشتق حرف <b>ü</b>: Kürzung ← kurz. <b>تنبيه:</b> بعض الكلمات تُحفظ حفظًا مثل Eltern وLeute وheute.
Fehlerfrei abschreiben und nach Diktat schreiben|<b>Fehlerfrei abschreiben:</b> 1. Lies einen Satz oder Abschnitt aufmerksam. 2. Merke dir Wortgruppen, nicht einzelne Buchstaben. 3. Decke den Text zu und schreibe aus dem Gedächtnis. 4. Vergleiche Wort für Wort mit der Vorlage und verbessere. <b>Diktat im Tandem:</b> Eine Person liest langsam und deutlich in Sinnabschnitten vor, die andere schreibt; dann tauscht ihr die Rollen und korrigiert gemeinsam. <b>Selbstdiktat:</b> Sprich den Text auf dein Handy, höre ihn mit Pausen an und schreibe ihn auf; danach vergleichst du mit der Vorlage. <b>Hilfen:</b> in Silben sprechen (Re-vier-förs-ter), verlängern, ableiten, Merkwörter, Wörterbuch. Falsch geschriebene Wörter schreibst du <b>mehrmals richtig</b> auf. <b>Achtung:</b> Nicht zu schnell schreiben; prüfe am Ende Satzanfänge (groß) und Satzzeichen.|<b>النسخ دون أخطاء:</b> 1. اقرأ جملة أو فقرة بانتباه. 2. احفظ مجموعات كلمات لا حروفًا منفردة. 3. غطِّ النص واكتب من الذاكرة. 4. قارن كلمة بكلمة مع الأصل وصحّح. <b>الإملاء مع شريك:</b> يقرأ أحدكما ببطء ووضوح على دفعات والآخر يكتب، ثم تتبادلان الأدوار وتصحّحان معًا. <b>الإملاء الذاتي:</b> سجّل النص على هاتفك واستمع إليه مع توقّفات واكتبه، ثم قارن بالأصل. <b>مساعدات:</b> النطق بالمقاطع، الإطالة، الاشتقاق، الكلمات المحفوظة، القاموس. الكلمات الخاطئة تكتبها <b>صحيحة عدة مرات</b>. <b>تنبيه:</b> لا تكتب بسرعة؛ وراجع في النهاية بدايات الجمل (حرف كبير) وعلامات الترقيم.
Einen sachlichen Bericht schreiben|Ein <b>Bericht</b> informiert kurz und <b>sachlich</b> über ein Ereignis. Vorgehen: 1. Ordne die Informationen mit den <b>W-Fragen</b> (Was? Wer? Wann? Wo? Wie? Warum? Welche Folgen?). 2. Finde eine <b>passende Überschrift</b> (z. B. «Trendsportarten am Schulsportfest»). 3. Schreibe einen <b>Einleitungssatz</b>, der Was? Wer? Wann? Wo? beantwortet (Am Samstag veranstaltete die Hans-Fischer-Schule ein Sportfest.). 4. Berichte die Geschehnisse in der <b>richtigen Reihenfolge</b>. 5. Nenne die <b>Folgen</b>. <b>Zeitform:</b> Präteritum (Die Schüler probierten Parkour aus.). Weglassen: <b>persönliche Eindrücke, Meinungen, Vermutungen und wörtliche Rede</b>. Denke an <b>Leser und Zweck</b> (z. B. Schulhomepage oder Unfallmeldung an die Versicherung mit genauem Ablauf). <b>Achtung:</b> Häufige Fehler: Zeitformen mischen, Wertungen wie «echt cool» schreiben, die Reihenfolge durcheinanderbringen.|<b>التقرير</b> يُخبر باختصار و<b>بموضوعية</b> عن حدث. الخطوات: 1. رتّب المعلومات بأسئلة <b>W</b> (ماذا؟ مَن؟ متى؟ أين؟ كيف؟ لماذا؟ ما النتائج؟). 2. اختر <b>عنوانًا مناسبًا</b> (مثل «الرياضات الرائجة في مهرجان المدرسة الرياضي»). 3. اكتب <b>جملة افتتاحية</b> تجيب عن ماذا ومن ومتى وأين (Am Samstag veranstaltete die Hans-Fischer-Schule ein Sportfest.). 4. اسرد الأحداث <b>بالترتيب الصحيح</b>. 5. اذكر <b>النتائج</b>. <b>الزمن:</b> الماضي البسيط Präteritum (Die Schüler probierten Parkour aus.). يُحذف: <b>الانطباعات الشخصية والآراء والتخمينات والكلام المنقول بنصّه</b>. فكّر في <b>القارئ والغرض</b> (مثل موقع المدرسة أو بلاغ حادث لشركة التأمين بتفاصيل دقيقة). <b>تنبيه:</b> أخطاء شائعة: خلط الأزمنة، كتابة أحكام مثل «رائع جدًّا»، وإرباك الترتيب.
Berichte prüfen: Checkliste, Bericht oder E-Mail, Flussdiagramm|<b>Checkliste:</b> passende Überschrift? richtige Reihenfolge? alle W-Fragen beantwortet? richtige Zeitform (Präteritum)? persönliche Eindrücke und Meinungen weggelassen? Schreibe zu jedem Punkt einen <b>Verbesserungsvorschlag</b> (z. B. Lege einen Plan an). <b>Bericht oder E-Mail?</b> Der Bericht ist sachlich, steht im Präteritum und enthält keine Gefühle; die E-Mail oder der Brief ist persönlich, hat Anrede und Gruß und enthält Gefühle und Meinungen («Ich war echt aufgeregt»). Gemeinsam ist beiden: Sie erzählen von Erlebtem. <b>Flussdiagramm:</b> Ereignisse stehen unter- oder nebeneinander und sind mit <b>Pfeilen</b> verbunden; gleichzeitige Ereignisse zeigt man mit <b>Verzweigungen</b>; die Uhrzeit steht neben dem Ereignis (10:45 Uhr: Helme und Schoner anlegen). <b>Achtung:</b> Streiche Gefühlswörter wie «super», «doof» oder «sauer» aus deinem Bericht.|<b>قائمة التدقيق:</b> هل العنوان مناسب؟ هل الترتيب صحيح؟ هل أُجيب عن كل أسئلة W؟ هل الزمن صحيح (Präteritum)؟ هل حُذفت الانطباعات والآراء الشخصية؟ اكتب لكل نقطة <b>اقتراح تحسين</b> (مثل: ضع خطة). <b>تقرير أم رسالة إلكترونية؟</b> التقرير موضوعي بالماضي البسيط وبلا مشاعر؛ أما الرسالة فشخصية فيها تحية وخاتمة ومشاعر وآراء («Ich war echt aufgeregt»). المشترك: كلاهما يروي تجربة. <b>المخطط الانسيابي (Flussdiagramm):</b> تُكتب الأحداث تحت بعضها أو بجانب بعضها وتُربط بـ<b>أسهم</b>؛ والأحداث المتزامنة تُمثَّل بـ<b>تفرّعات</b>؛ ويُكتب الوقت بجانب الحدث (10:45 Uhr: Helme und Schoner anlegen). <b>تنبيه:</b> احذف من تقريرك كلمات المشاعر مثل «super» و«doof» و«sauer».
Zeitstufen und Zeitformen|Es gibt drei <b>Zeitstufen</b>: Gegenwart, Vergangenheit, Zukunft. Dazu gehören fünf <b>Zeitformen</b>: <b>Präsens</b> (wir veranstalten) · <b>Präteritum</b> (wir veranstalteten) · <b>Perfekt</b> (wir haben veranstaltet) · <b>Plusquamperfekt</b> (wir hatten veranstaltet) · <b>Futur</b> (wir werden veranstalten). <b>Bildung:</b> Perfekt = haben/sein im Präsens + Partizip II; Plusquamperfekt = hatte/war + Partizip II; Futur = werden + Infinitiv. <b>sein</b> steht bei Bewegung und Zustandsänderung (er ist gefahren, sie ist gestürzt), <b>haben</b> bei den meisten anderen Verben (wir haben gewonnen). <b>Gebrauch:</b> Das <b>Präteritum</b> nutzt man in Berichten und Erzählungen, das <b>Perfekt</b> im Gespräch, das <b>Plusquamperfekt</b> für etwas, das <b>vorher</b> geschah: Nachdem wir beschlossen hatten, eine Pause zu machen, reinigten wir die Räder. <b>Achtung:</b> Falsch ist «Ich habe gegangen» (richtig: Ich bin gegangen); im Nebensatz mit «nachdem» steht das Verb am Ende.|هناك ثلاث <b>مراحل زمنية</b>: الحاضر والماضي والمستقبل، وخمس <b>صيغ زمنية</b>: <b>Präsens</b> (wir veranstalten) · <b>Präteritum</b> (wir veranstalteten) · <b>Perfekt</b> (wir haben veranstaltet) · <b>Plusquamperfekt</b> (wir hatten veranstaltet) · <b>Futur</b> (wir werden veranstalten). <b>التكوين:</b> Perfekt = haben/sein في المضارع + اسم المفعول Partizip II؛ Plusquamperfekt = hatte/war + Partizip II؛ Futur = werden + المصدر. يُستعمل <b>sein</b> مع الحركة وتغيّر الحال (er ist gefahren, sie ist gestürzt) و<b>haben</b> مع معظم الأفعال الأخرى (wir haben gewonnen). <b>الاستعمال:</b> <b>Präteritum</b> في التقارير والحكايات، و<b>Perfekt</b> في الحديث، و<b>Plusquamperfekt</b> لما حدث <b>قبل</b> غيره: Nachdem wir beschlossen hatten, eine Pause zu machen, reinigten wir die Räder. <b>تنبيه:</b> خطأ: «Ich habe gegangen» والصواب «Ich bin gegangen»؛ وفي الجملة التابعة مع «nachdem» يأتي الفعل في النهاية.
Stammformen der Verben|Die <b>Stammformen</b> eines Verbs sind <b>Infinitiv – Präteritum – Partizip II</b>. Starke (unregelmäßige) Verben ändern den Stammvokal: stehen – stand – gestanden · helfen – half – geholfen · gehen – ging – gegangen · sprechen – sprach – gesprochen · tragen – trug – getragen · singen – sang – gesungen · laufen – lief – gelaufen · schreiben – schrieb – geschrieben · fallen – fiel – gefallen. Gemischte Verben: bringen – brachte – gebracht · wissen – wusste – gewusst. Unregelmäßig sind auch: sein – war – gewesen · tun – tat – getan. Schwache (regelmäßige) Verben haben -te/-t: winken – winkte – gewinkt, veranstalten – veranstaltete – veranstaltet. Aus den Stammformen bildest du alle Zeitformen. Verben mit be-, ver-, er-, ent- und auf -ieren bekommen im Partizip II <b>kein ge-</b>: erzählt, veranstaltet, kontrolliert. <b>Achtung:</b> Falsche Formen sind z. B. «gegehen», «gelaufet», «gebringt».|<b>الصيغ الأساسية</b> للفعل هي <b>المصدر – الماضي البسيط – اسم المفعول Partizip II</b>. الأفعال القوية (الشاذة) تغيّر حرف العلّة الجذري: stehen – stand – gestanden · helfen – half – geholfen · gehen – ging – gegangen · sprechen – sprach – gesprochen · tragen – trug – getragen · singen – sang – gesungen · laufen – lief – gelaufen · schreiben – schrieb – geschrieben · fallen – fiel – gefallen. أفعال مختلطة: bringen – brachte – gebracht · wissen – wusste – gewusst. وشاذان أيضًا: sein – war – gewesen · tun – tat – getan. الأفعال الضعيفة (المنتظمة) تأخذ -te/-t: winken – winkte – gewinkt، veranstalten – veranstaltete – veranstaltet. ومن الصيغ الأساسية تكوّن كل الأزمنة. الأفعال ذات be- وver- وer- وent- والأفعال المنتهية بـ -ieren لا تأخذ <b>ge-</b> في Partizip II: erzählt, veranstaltet, kontrolliert. <b>تنبيه:</b> صيغ خاطئة مثل «gegehen» و«gelaufet» و«gebringt».
Adverbien und die Schreibung von Zeitangaben|<b>Adverbien</b> (Umstandswörter) bestimmen Verben oder Adjektive näher, werden <b>kleingeschrieben</b>, sind <b>unveränderbar</b>, antworten auf <b>Wann? Wo?</b> und sind im Satz <b>leicht umstellbar</b>: abends, gern, heute, morgen, hier. Adverbien auf <b>-s</b> (montags, abends, morgens) drücken aus, dass sich etwas <b>immer zur selben Zeit wiederholt</b>: Ich gehe montags zum Training. = Ich gehe jeden Montag zum Training. <b>Nomen</b> in Zeitangaben schreibt man <b>groß</b>; man erkennt sie oft am Begleiter: der Mittwoch, jeden Vormittag, eines Abends, am Morgen, ab Donnerstag. <b>Tipp:</b> der Morgen (Tageszeit) → groß; morgen (der nächste Tag) → klein. Weitere Beispiele: heute Abend, gestern Morgen (Adverb + Nomen), dienstagnachmittags (zusammen, klein), übermorgen. <b>Achtung:</b> Häufige Fehler: «Montags» mitten im Satz großschreiben oder «am Morgen» kleinschreiben.|<b>الظروف (Adverbien)</b> تحدّد الأفعال أو الصفات، وتُكتب <b>بحرف صغير</b>، و<b>لا تتغيّر</b>، وتجيب عن <b>Wann? Wo?</b>، و<b>يسهل نقلها</b> في الجملة: abends, gern, heute, morgen, hier. الظروف المنتهية بـ <b>-s</b> (montags, abends, morgens) تدلّ على <b>تكرار الشيء دائمًا في الوقت نفسه</b>: Ich gehe montags zum Training. = Ich gehe jeden Montag zum Training. أما <b>الأسماء</b> في تعابير الزمن فتُكتب <b>بحرف كبير</b> وتُعرف غالبًا من المرافق: der Mittwoch, jeden Vormittag, eines Abends, am Morgen, ab Donnerstag. <b>نصيحة:</b> der Morgen (وقت من اليوم) ← حرف كبير؛ morgen (اليوم التالي) ← حرف صغير. أمثلة أخرى: heute Abend, gestern Morgen (ظرف + اسم)، dienstagnachmittags (متصلة وصغيرة)، übermorgen. <b>تنبيه:</b> أخطاء شائعة: كتابة «Montags» بحرف كبير وسط الجملة أو «am Morgen» بحرف صغير.`);

<script>
(()=>{
const q=s=>document.querySelector(s);
const ST={acc:'de-DE',vo:'',rate:.9,pitch:1,vol:1,fx:.6};
try{Object.assign(ST,JSON.parse(localStorage.dosA||'{}'))}catch(e){}
const save=()=>{try{localStorage.dosA=JSON.stringify(ST)}catch(e){}};
document.documentElement.style.setProperty('--fs',(ST.fs||17)+'px');
/* ---- Voices & accent ---- */
let voices=[];
function loadV(){voices=(speechSynthesis.getVoices()||[]).filter(v=>/^de/i.test(v.lang));
 const pref=voices.filter(v=>v.lang.replace('_','-').toLowerCase()==ST.acc.toLowerCase());
 const list=pref.length?pref:voices;
 q('#vo').innerHTML='<option value="">Automatisch</option>'+list.map(v=>`<option ${v.name==ST.vo?'selected':''}>${v.name}</option>`).join('');
 q('#accn').textContent=ST.acc!='de-DE'&&!pref.length?'Hinweis: Auf diesem Gerät ist keine eigene '+(ST.acc=='de-CH'?'Schweizer':'österreichische')+' Stimme installiert – es wird die beste verfügbare Stimme mit '+ST.acc+'-Einstellung genutzt.':'';}
try{loadV();speechSynthesis.onvoiceschanged=loadV}catch(e){}
function pickVoice(){if(ST.vo){const v=voices.find(v=>v.name==ST.vo);if(v)return v}
 return voices.find(v=>v.lang.replace('_','-').toLowerCase()==ST.acc.toLowerCase())||voices.find(v=>/de-DE/i.test(v.lang))||voices[0]}
const CH={'ß':'ss'};
try{const orig=speechSynthesis.speak.bind(speechSynthesis);
 speechSynthesis.speak=u=>{if(u&&/^de/i.test(u.lang||'de')){u.lang=ST.acc;const v=pickVoice();if(v)u.voice=v;u.rate=ST.rate;u.pitch=ST.pitch;u.volume=ST.vol;
  if(ST.acc=='de-CH')try{u.text=u.text.replace(/ß/g,'ss')}catch(e){}}orig(u)}}catch(e){}
const bind=(id,k,fmt,cb)=>{const el=q('#'+id),o=q('#'+id+'v');if(ST[k]!=null)el.value=ST[k];const up=()=>{ST[k]=+el.value;if(o)o.textContent=fmt(+el.value);save();cb&&cb()};el.oninput=up;up()};
bind('sr','rate',v=>v.toFixed(2));bind('spt','pitch',v=>v.toFixed(1));bind('svl','vol',v=>Math.round(v*100)+'%');bind('fxv','fx',v=>Math.round(v*100)+'%');
bind('fsz','fs',v=>v,()=>document.documentElement.style.setProperty('--fs',ST.fs+'px'));
q('#acc').value=ST.acc;q('#acc').onchange=e=>{ST.acc=e.target.value;ST.vo='';save();loadV();demo()};
q('#vo').onchange=e=>{ST.vo=e.target.value;save();demo()};
const demo=()=>sp(ST.acc=='de-CH'?'Grüezi! Ich möchte einen interessanten Beruf kennenlernen.':ST.acc=='de-AT'?'Servus! Ich möchte einen interessanten Beruf kennenlernen.':'Hallo! Ich möchte einen interessanten Beruf kennenlernen.');
q('#stb').onclick=()=>q('#studio').classList.toggle('on');
/* ---- Recording ---- */
let mr,chunks=[],t0,tm,an,raf,stream,n=0;
q('#rb').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('Mikrofon nicht verfügbar oder nicht erlaubt.');return}
 mr=new MediaRecorder(stream);chunks=[];mr.ondataavailable=e=>chunks.push(e.data);
 mr.onstop=()=>{const b=new Blob(chunks,{type:mr.mimeType||'audio/webm'}),u=URL.createObjectURL(b);n++;
  const d=document.createElement('div');d.innerHTML=`<audio controls src="${u}"></audio><small>Aufnahme ${n} · <a href="${u}" download="Aussprache_${n}.webm">Speichern</a></small>`;q('#recs').prepend(d);
  stream.getTracks().forEach(t=>t.stop());cancelAnimationFrame(raf);clearInterval(tm);q('#lv i').style.width=0;q('#stb').classList.remove('rec');tone([523,659],.08)};
 const c=new AudioContext(),src=c.createMediaStreamSource(stream);an=c.createAnalyser();src.connect(an);const arr=new Uint8Array(an.fftSize);
 const lp=()=>{an.getByteTimeDomainData(arr);let m=0;arr.forEach(x=>m=Math.max(m,Math.abs(x-128)));q('#lv i').style.width=Math.min(100,m*1.6)+'%';raf=requestAnimationFrame(lp)};lp();
 mr.start();t0=Date.now();tm=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);q('#rt2').innerHTML=`<small>● ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}</small>`},250);
 q('#rb').disabled=true;q('#rs2').disabled=false;q('#stb').classList.add('rec')};
q('#rs2').onclick=()=>{mr&&mr.state!='inactive'&&mr.stop();q('#rb').disabled=false;q('#rs2').disabled=true};
let last='';q('#rp').onclick=()=>last&&sp(last);
document.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){last=b.dataset.t;q('#rp').disabled=false;q('#rp').title=last}},true);
/* ---- Sound effects ---- */
let fc;const tone=(fs,d=.12,type='sine',gap)=>{if(!ST.fx||mute2)return;try{fc=fc||new AudioContext();fs.forEach((f,i)=>{const o=fc.createOscillator(),g=fc.createGain(),t=fc.currentTime+i*(gap||d);o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18*ST.fx,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d*1.8);o.connect(g);g.connect(fc.destination);o.start(t);o.stop(t+d*2)})}catch(e){}};
let mute2=false;mute=true;
const mt=q('#mt');mt.onclick=()=>{mute2=!mute2;mt.textContent=mute2?'🔇':'🔔'};
const FX={ok:()=>tone([523,659,784,1047],.09,'triangle'),no:()=>tone([311,233],.18,'sawtooth',.16),click:()=>tone([880],.03,'square'),chip:()=>tone([660,990],.04,'triangle'),tab:()=>tone([392,523],.05,'sine'),fan:()=>tone([523,659,784,659,784,1047],.12,'triangle')};
const burst=(el,ch)=>{const r=el.getBoundingClientRect();for(let i=0;i<14;i++){const s=document.createElement('span');s.className='fx-burst';s.textContent=ch[i%ch.length];s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+30)+'px';s.style.setProperty('--dx',(Math.random()*240-120)+'px');s.style.setProperty('--dy',(Math.random()*-160-20)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}};
new MutationObserver(ms=>ms.forEach(m=>{const t=m.target;if(m.type=='attributes'&&t.classList&&t.classList.contains('q')){const o=m.oldValue||'';if(t.classList.contains('ok')&&!/\bok\b/.test(o)){FX.ok();t.classList.add('pop');burst(t,['✦','★','✓'])}else if(t.classList.contains('no')&&!/\bno\b/.test(o)){FX.no();t.classList.add('shake')}setTimeout(()=>t.classList.remove('pop','shake'),600)}
 if(m.type=='childList'&&t.id=='rs'&&t.querySelector('.note')){FX.fan();burst(t,['🎓','★','✦'])}}))
 .observe(document.body,{subtree:true,attributes:true,attributeFilter:['class'],attributeOldValue:true,childList:true});
document.addEventListener('click',e=>{if(e.target.closest('.chip'))FX.chip();else if(e.target.closest('nav button'))FX.tab();else if(e.target.closest('label,.sb button,.ico'))FX.click()},true);
/* ---- In-book translation ---- */
const cache={};try{Object.assign(cache,JSON.parse(localStorage.dosT||'{}'))}catch(e){}
async function trn(t,to){const k=to+'|'+t;if(cache[k])return cache[k];
 let s;try{const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=de&tl='+encodeURIComponent(to)+'&dt=t&q='+encodeURIComponent(t));
 const j=await r.json();s=j[0].map(x=>x[0]).join('')}catch(e){const r=await fetch('https://api.mymemory.translated.net/get?langpair=de|'+encodeURIComponent(to)+'&q='+encodeURIComponent(t));const j=await r.json();s=j.responseData.translatedText;if(!s)throw e}cache[k]=s;try{localStorage.dosT=JSON.stringify(cache)}catch(e){}return s}
const tgt=()=>L=='de'?(navigator.language||'ar').split('-')[0]=='de'?'ar':(navigator.language||'ar').split('-')[0]:L;
async function fill(a){const t=decodeURIComponent((a.href.match(/text=([^&]*)/)||[])[1]||'');if(!t)return;
 const sp_=document.createElement('span');sp_.className='itr ld';sp_.textContent='Übersetzung …';if(['ar','fa','ur'].includes(L))sp_.dir='rtl';a.replaceWith(sp_);
 try{sp_.textContent=await trn(t,L);sp_.classList.remove('ld')}catch(e){sp_.textContent='Übersetzung offline nicht verfügbar';}}
let io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);fill(e.target)}}),{rootMargin:'300px'});
const scan=()=>document.querySelectorAll('a.gt:not([data-o])').forEach(a=>{a.dataset.o=1;io.observe(a)});
new MutationObserver(()=>{scan();wrap()}).observe(q('main'),{childList:true,subtree:true});scan();
/* ---- Interactive words: click to hear, dblclick to translate ---- */
const tip=q('#tip');let tt;
function wrap(){document.querySelectorAll('main .vc>b, main .card>b:not(.wdone), main .ex, main .q > div:not(.fb)').forEach(el=>{if(el.dataset.w||el.closest('.tr'))return;el.dataset.w=1;
 [...el.childNodes].forEach(nd=>{if(nd.nodeType==3&&nd.textContent.trim()){const f=document.createDocumentFragment();nd.textContent.split(/(\s+)/).forEach(w=>{if(/[A-Za-zÄÖÜäöüß]/.test(w)){const s=document.createElement('span');s.className='wd';s.textContent=w;f.appendChild(s)}else f.appendChild(document.createTextNode(w))});nd.replaceWith(f)}})})}
document.addEventListener('click',e=>{const w=e.target.closest('.wd');if(!w)return;sp(w.textContent.replace(/[.,!?„“"():;…]/g,''))});
document.addEventListener('dblclick',async e=>{const w=e.target.closest('.wd');if(!w)return;e.preventDefault();const word=w.textContent.replace(/[.,!?„“"():;…]/g,'');const r=w.getBoundingClientRect();
 tip.style.display='block';tip.style.left=Math.min(innerWidth-310,r.left)+'px';tip.style.top=(r.bottom+6)+'px';tip.innerHTML=`<b>${word}</b><br>…`;
 const to=tgt();try{const s=await trn(word,to);tip.innerHTML=`<b>${word}</b><br><span dir="${['ar','fa','ur'].includes(to)?'rtl':'ltr'}">${s}</span>`}catch(x){tip.innerHTML=`<b>${word}</b><br>offline`}
 clearTimeout(tt);tt=setTimeout(()=>tip.style.display='none',4000)});
document.addEventListener('scroll',()=>tip.style.display='none',{passive:true});
wrap();
})();
</script>
</body></html>
